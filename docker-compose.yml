# Levanta PostgreSQL para desarrollo:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: alquiler-maquinaria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: alquiler
      POSTGRES_PASSWORD: alquiler
      POSTGRES_DB: alquiler_maquinaria
      TZ: America/Lima
    ports:
      - "5433:5432"   # 5433 en tu PC para no chocar con un PostgreSQL ya instalado
    volumes:
      - datos_pg:/var/lib/postgresql/data
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alquiler -d alquiler_maquinaria"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_pg:
