<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="Alquiler de maquinaria pesada por horas: catálogo, disponibilidad en vivo y reservas en línea." />
    <!-- Aplica el tema antes de pintar para evitar el destello del tema equivocado (ver src/utils/tema.js) -->
    <script>
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem('maquirenta.tema');
        } catch (e) {}
        if (tema !== 'light' && tema !== 'dark') {
          tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', tema);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', tema === 'dark' ? '#0b1220' : '#f8fafc');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>MaquiRenta · Alquiler de maquinaria</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
