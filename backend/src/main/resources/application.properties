# La configuración real (base de datos, JWT, CORS, Cloudinary, puerto...) se lee de
# variables de entorno y de backend/.env: ver alquiler.config.Config
spring.application.name=alquiler-backend
spring.main.banner-mode=off

# Un hilo virtual (Java 21) por petición
spring.threads.virtual.enabled=true

# Las fotos las lee MaquinaControlador con su propio lector de multipart
spring.servlet.multipart.enabled=false

logging.level.root=INFO
